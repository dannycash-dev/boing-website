<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/boinglogo7.png" />
    <meta name="description" content="The Boing app." />
    <title>App | Boing Systems Limited</title>
    <style>
        :root {
            --ink: #12223d;
            --paper: #f8f7f2;
            --coral: #c84e39;
            --blue: #2474d1;
            --line: #dce2e5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(720px, calc(100% - 36px));
            margin: 0 auto;
            padding: 42px 0 80px;
        }

        a {
            color: var(--coral);
            font-weight: 600;
        }

        .back {
            text-decoration: none;
            font-size: 0.9rem;
        }

        h1 {
            margin: 58px 0 12px;
            font-family: Georgia, serif;
            font-size: clamp(2.7rem, 8vw, 4.5rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .app-mark {
            display: block;
            width: 100%;
            margin: 34px 0 40px;
            border-radius: 4px;
            box-shadow: 0 18px 40px rgba(18, 34, 61, 0.14);
        }

        .status {
            display: inline-block;
            margin: 0 0 16px;
            padding: 6px 10px;
            border: 1px solid var(--blue);
            color: var(--blue);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
            text-transform: uppercase;
        }

        .intro {
            max-width: 600px;
            border-top: 1px solid var(--line);
            padding-top: 24px;
        }

        .intro h2 {
            margin: 0 0 12px;
            font-family: Georgia, serif;
            font-size: 1.8rem;
            line-height: 1.2;
        }

        .intro p {
            margin: 0;
            color: #3c4b61;
            font-size: 1.08rem;
        }

        @media (max-width: 560px) {
            .app-mark {
                margin: 28px 0 32px;
            }
        }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../index.html">&larr; Back to Boing</a>
        <h1>App</h1>
        <img class="app-mark" src="../assets/boinglogo7.png" alt="Boing logo" />
        <section class="intro" aria-labelledby="development-heading">
            <p class="status">In Development</p>
            <h2 id="development-heading">A simpler way to move money is on its way.</h2>
            <p>We are building the Boing app now, with a focus on making everyday payments feel clear, quick, and
                easier to manage. This page will be updated when the app is ready to try.</p>
        </section>
    </main>
</body>

</html>
