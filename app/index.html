<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Boing app." />
    <title>App | Boing Systems Limited</title>
    <style>
        :root {
            --ink: #12223d;
            --paper: #f8f7f2;
            --coral: #c84e39;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(720px, calc(100% - 36px));
            margin: 0 auto;
            padding: 42px 0 80px;
        }

        a {
            color: var(--coral);
            font-weight: 600;
        }

        .back {
            text-decoration: none;
            font-size: 0.9rem;
        }

        h1 {
            margin: 58px 0 12px;
            font-family: Georgia, serif;
            font-size: clamp(2.7rem, 8vw, 4.5rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../index.html">&larr; Back to Boing</a>
        <h1>App</h1>
    </main>

</html>
