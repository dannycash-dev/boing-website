<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Boing Systems Limited." />
    <title>Contact | Boing Systems Limited</title>
    <style>
        :root {
            --ink: #12223d;
            --paper: #f8f7f2;
            --coral: #c84e39;
            --muted: #607084;
            --line: #d6dde0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(720px, calc(100% - 36px));
            margin: 0 auto;
            padding: 42px 0 80px;
        }

        a {
            color: var(--coral);
            font-weight: 600;
        }

        .back {
            text-decoration: none;
            font-size: 0.9rem;
        }

        h1 {
            margin: 58px 0 12px;
            font-family: Georgia, serif;
            font-size: clamp(2.7rem, 8vw, 4.5rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .intro {
            max-width: 560px;
            margin-bottom: 32px;
        }

        form {
            display: grid;
            gap: 20px;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        label {
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 12px 14px;
            color: var(--ink);
            background: #fff;
            font: inherit;
        }

        input:focus,
        textarea:focus {
            outline: 3px solid rgba(200, 78, 57, 0.2);
            border-color: var(--coral);
        }

        textarea {
            min-height: 170px;
            resize: vertical;
        }

        button {
            width: fit-content;
            border: 0;
            border-radius: 4px;
            padding: 12px 20px;
            background: var(--coral);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover {
            background: #a83f2e;
        }

        .privacy-note {
            margin: -4px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .honeypot {
            position: absolute;
            left: -9999px;
        }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../index.html">&larr; Back to Boing</a>
        <h1>Contact</h1>
        <p class="intro">Have a question or need help with Boing? Send us a message and we&rsquo;ll get back to you at
            the email address you provide.</p>

        <form action="https://formsubmit.co/hello@boing.nz" method="POST">
            <input type="hidden" name="_subject" value="New message from the Boing contact form">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="true">
            <div class="honeypot" aria-hidden="true">
                <label for="website">Leave this field empty</label>
                <input id="website" type="text" name="_honey" tabindex="-1" autocomplete="off">
            </div>

            <div class="field">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="subject">Subject</label>
                <input id="subject" name="subject" type="text" required>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <p class="privacy-note">By submitting this form, you agree that we may use your details to respond to your
                message.</p>
            <button type="submit">Send message</button>
        </form>
    </main>
</body>

</html>
