<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/boing_al_logo.png" />
    <meta name="description" content="Boing pricing." />
    <title>Pricing | Boing Systems Limited</title>
    <style>
        :root {
            --ink: #12223d;
            --paper: #f8f7f2;
            --coral: #c84e39;
            --line: #dce2e5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(720px, calc(100% - 36px));
            margin: 0 auto;
            padding: 42px 0 80px;
        }

        a {
            color: var(--coral);
            font-weight: 600;
        }

        .back {
            text-decoration: none;
            font-size: 0.9rem;
        }

        h1 {
            margin: 58px 0 12px;
            font-family: Georgia, serif;
            font-size: clamp(2.7rem, 8vw, 4.5rem);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .lead {
            max-width: 640px;
            margin: 0 0 48px;
            font-family: Georgia, serif;
            font-size: clamp(1.45rem, 3vw, 2rem);
            line-height: 1.35;
        }

        .section {
            border-top: 1px solid var(--line);
            padding-top: 22px;
        }

        .section + .section {
            margin-top: 42px;
        }

        h2 {
            margin: 0 0 10px;
            font-family: Georgia, serif;
            font-size: 1.55rem;
            line-height: 1.2;
        }

        .section p {
            max-width: 640px;
            margin: 0 0 16px;
            color: #3c4b61;
        }

        .options {
            margin: 22px 0 0;
            padding-left: 22px;
            color: #3c4b61;
        }

        .options li {
            margin: 10px 0;
            padding-left: 4px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 22px;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../index.html">&larr; Back to Boing</a>
        <h1>Pricing coming soon</h1>
        <p class="lead">Pricing information will be available after launch.</p>
    </main>
</body>

</html>
